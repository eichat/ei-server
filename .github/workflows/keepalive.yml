# Не дати заснути базі Supabase.
#
# Безкоштовний тариф Supabase присипляє проєкт після ~7 днів БЕЗ ЗАПИТІВ ДО БД.
# Саме так 26.08.2026 зник порожній тестовий проєкт, створений 10.08. Для
# продакшн-бази це означало б: тиждень без активності → застосунок перестає
# працювати для всіх, без жодної помилки в коді.
#
# Чому саме /keepalive, а не /health: health і ping до Supabase не звертаються
# взагалі, тож пінг на них піднімає лише веб-сервіс Render, а база далі спить.
#
# ⚠️ GitHub вимикає заплановані workflow у репозиторіях, де 60 днів немає
# активності. Якщо в проєкті буде довга пауза — увімкнути вручну у вкладці
# Actions (або запустити кнопкою "Run workflow").

name: keepalive

on:
  schedule:
    # Кожні 6 годин. Хвилина не нульова навмисно: о рівній годині черга
    # планувальника GitHub найдовша, запуск може зсунутись на десятки хвилин.
    - cron: '17 */6 * * *'
  workflow_dispatch:        # щоб можна було натиснути вручну

jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Розбудити сервер і базу
        run: |
          URL="https://ei-server.onrender.com/keepalive"
          # Render на безкоштовному тарифі спить після 15 хв простою і
          # прокидається 30–50 с, тому довгий таймаут і три спроби.
          for i in 1 2 3; do
            echo "Спроба $i…"
            code=$(curl -s -o response.json -w '%{http_code}' --max-time 90 "$URL" || echo "000")
            echo "HTTP $code"
            cat response.json 2>/dev/null; echo
            if [ "$code" = "200" ]; then
              echo "✅ База відповідає"
              exit 0
            fi
            sleep 30
          done
          echo "❌ Сервер або база не відповіли за три спроби"
          exit 1
